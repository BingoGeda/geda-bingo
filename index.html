<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  >

  <title>Bingo Geda</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #18202a;
      min-height: 100vh;
    }

    .app {
      max-width: 560px;
      margin: auto;
      padding: 14px;
    }

    /* ================= HEADER ================= */

    .header {
      background: linear-gradient(
        135deg,
        #111827,
        #273449
      );

      color: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .brand {
      font-size: 27px;
      font-weight: 900;
    }

    .subtitle {
      margin-top: 5px;
      opacity: .75;
      font-size: 13px;
    }

    .user {
      margin-top: 15px;
      padding: 10px 13px;
      border-radius: 12px;
      background: rgba(255,255,255,.1);
      font-size: 13px;
    }

    /* ================= INFO ================= */

    .grid {
      display: grid;
      grid-template-columns:
        repeat(3, 1fr);

      gap: 8px;
      margin-bottom: 14px;
    }

    .box {
      background: white;
      padding: 14px 7px;
      text-align: center;
      border-radius: 15px;

      box-shadow:
        0 3px 12px rgba(0,0,0,.06);
    }

    .label {
      font-size: 10px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .value {
      font-size: 17px;
      font-weight: 900;
    }

    /* ================= LAST NUMBER ================= */

    .called {
      background: white;
      border-radius: 20px;
      padding: 18px;
      text-align: center;
      margin-bottom: 14px;
    }

    .called-title {
      color: #6b7280;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .called-number {
      width: 90px;
      height: 90px;

      margin: auto;

      border-radius: 50%;

      background: #111827;
      color: white;

      display: flex;
      justify-content: center;
      align-items: center;

      font-size: 29px;
      font-weight: 900;

      box-shadow:
        0 5px 18px rgba(0,0,0,.18);
    }

    /* ================= VOICE ================= */

    .voice-box {
      background: white;
      border-radius: 16px;
      padding: 12px;
      margin-bottom: 14px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      box-shadow:
        0 3px 12px rgba(0,0,0,.05);
    }

    .voice-text {
      font-size: 13px;
      font-weight: 800;
    }

    .voice-button {
      width: auto;
      margin: 0;
      padding: 9px 14px;

      background: #16a34a;
      color: white;

      font-size: 13px;
      border-radius: 10px;
    }

    .voice-button.off {
      background: #6b7280;
    }

    /* ================= SECTIONS ================= */

    .section {
      background: white;
      padding: 15px;
      border-radius: 20px;
      margin-bottom: 14px;
    }

    .title {
      font-size: 17px;
      font-weight: 900;
      margin-bottom: 12px;
    }

    /* ================= CARD ================= */

    .card {
      display: grid;
      grid-template-columns:
        repeat(5, 1fr);

      gap: 5px;
    }

    .cell {
      aspect-ratio: 1;

      background: #eef1f5;

      border-radius: 9px;

      display: flex;
      justify-content: center;
      align-items: center;

      font-weight: 800;
      font-size: 16px;

      transition: .2s;
    }

    .head {
      background: #111827;
      color: white;
      font-size: 14px;
    }

    .marked {
      background: #16a34a;
      color: white;

      transform: scale(.96);

      box-shadow:
        0 2px 8px rgba(22,163,74,.3);
    }

    .free {
      background: #f59e0b;
      color: white;
    }

    /* ================= NUMBERS ================= */

    .numbers {
      display: grid;

      grid-template-columns:
        repeat(10, 1fr);

      gap: 5px;
    }

    .num {
      aspect-ratio: 1;

      border-radius: 50%;

      background: #eef1f5;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 11px;
      font-weight: 700;

      transition: .2s;
    }

    .num.called {
      background: #111827;
      color: white;

      transform: scale(.95);

      box-shadow:
        0 2px 6px rgba(0,0,0,.15);
    }

    /* ================= BUTTONS ================= */

    button {
      width: 100%;
      border: 0;

      padding: 15px;

      border-radius: 15px;

      font-size: 16px;
      font-weight: 900;

      cursor: pointer;

      margin-top: 8px;
    }

    button:active {
      transform: scale(.98);
    }

    .pay {
      background: #16a34a;
      color: white;
    }

    /* ================= OWNER ================= */

    .owner {
      display: none;

      background: white;

      border-radius: 20px;

      padding: 15px;

      margin-bottom: 14px;

      border: 2px solid #111827;
    }

    .owner-title {
      font-size: 18px;
      font-weight: 900;
      margin-bottom: 10px;
    }

    .owner button {
      background: #111827;
      color: white;
    }

    .owner button.danger {
      background: #dc2626;
    }

    .owner button.auto {
      background: #7c3aed;
    }

    /* ================= STATUS ================= */

    .status {
      text-align: center;

      margin: 12px 0;

      font-size: 13px;

      color: #6b7280;

      min-height: 20px;
    }

    /* ================= WINNER ================= */

    .winner {
      display: none;

      background: #f59e0b;

      color: white;

      text-align: center;

      padding: 15px;

      border-radius: 16px;

      margin-bottom: 14px;

      font-weight: 900;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 380px) {

      .app {
        padding: 10px;
      }

      .cell {
        font-size: 13px;
      }

      .num {
        font-size: 9px;
      }

      .brand {
        font-size: 23px;
      }

    }

  </style>
</head>

<body>

<div class="app">

  <!-- ================= HEADER ================= -->

  <div class="header">

    <div class="brand">
      🎱 Bingo Geda
    </div>

    <div class="subtitle">
      Multiplayer Bingo Mini App
    </div>

    <div
      class="user"
      id="userBox"
    >
      👤 Connecting to Telegram...
    </div>

  </div>


  <!-- ================= GAME INFO ================= -->

  <div class="grid">

    <div class="box">

      <div class="label">
        ENTRY
      </div>

      <div
        class="value"
        id="entry"
      >
        -- ETB
      </div>

    </div>


    <div class="box">

      <div class="label">
        PLAYERS
      </div>

      <div
        class="value"
        id="players"
      >
        0/50
      </div>

    </div>


    <div class="box">

      <div class="label">
        PRIZE
      </div>

      <div
        class="value"
        id="prize"
      >
        -- ETB
      </div>

    </div>

  </div>


  <!-- ================= LAST NUMBER ================= -->

  <div class="called">

    <div class="called-title">
      LAST CALLED NUMBER
    </div>

    <div
      class="called-number"
      id="lastNumber"
    >
      —
    </div>

  </div>


  <!-- ================= VOICE ================= -->

  <div class="voice-box">

    <div class="voice-text">
      🔊 Number Voice
    </div>

    <button
      class="voice-button"
      id="voiceButton"
      onclick="toggleVoice()"
    >
      🔊 VOICE ON
    </button>

  </div>


  <!-- ================= WINNER ================= -->

  <div
    class="winner"
    id="winnerBox"
  >
    🏆 BINGO WINNER!
  </div>


  <!-- ================= OWNER ================= -->

  <div
    class="owner"
    id="ownerPanel"
  >

    <div class="owner-title">
      👑 OWNER CONTROLS
    </div>

    <button
      onclick="newGame()"
    >
      🆕 NEW GAME
    </button>

    <button
      onclick="callNumber()"
    >
      🎱 CALL NUMBER
    </button>

    <button
      class="auto"
      onclick="toggleAuto()"
    >
      🤖 AUTO CALL ON / OFF
    </button>

    <button
      class="danger"
      onclick="resetGame()"
    >
      🔄 RESET GAME
    </button>

  </div>


  <!-- ================= BINGO CARD ================= -->

  <div class="section">

    <div class="title">
      🎟️ Your Bingo Card
    </div>

    <div
      class="card"
      id="bingoCard"
    >

      <div class="cell head">
        B
      </div>

      <div class="cell head">
        I
      </div>

      <div class="cell head">
        N
      </div>

      <div class="cell head">
        G
      </div>

      <div class="cell head">
        O
      </div>

    </div>

  </div>


  <!-- ================= CALLED NUMBERS ================= -->

  <div class="section">

    <div class="title">
      🔢 Called Numbers
    </div>

    <div
      class="numbers"
      id="numbers"
    ></div>

  </div>


  <!-- ================= PAYMENT ================= -->

  <button
    class="pay"
    onclick="payAndJoin()"
  >
    💳 PAY WITH TELEBIRR & JOIN
  </button>


  <!-- ================= STATUS ================= -->

  <div
    class="status"
    id="status"
  >
    Connecting...
  </div>

</div>


<script>

/* =====================================================
   TELEGRAM
===================================================== */

const tg =
  window.Telegram?.WebApp;

if (tg) {

  tg.ready();

  tg.expand();

}


/* =====================================================
   API
===================================================== */

const API =
  location.origin;

const initData =
  tg?.initData || "";


/* =====================================================
   STATE
===================================================== */

let currentGame = null;

let myPlayer = null;

let myCard = null;

let socket = null;

let isOwner = false;

let autoCall = false;

let voiceEnabled = true;


/* =====================================================
   API HEADERS
===================================================== */

function headers() {

  const h = {
    "Content-Type":
      "application/json"
  };

  if (initData) {

    h[
      "X-Telegram-Init-Data"
    ] = initData;

  }

  return h;

}


/* =====================================================
   STATUS
===================================================== */

function setStatus(message) {

  document.getElementById(
    "status"
  ).textContent = message;

}


/* =====================================================
   VOICE
===================================================== */

function toggleVoice() {

  voiceEnabled =
    !voiceEnabled;

  const button =
    document.getElementById(
      "voiceButton"
    );

  if (voiceEnabled) {

    button.textContent =
      "🔊 VOICE ON";

    button.classList.remove(
      "off"
    );

    /* Unlock speech engine */

    speakText(
      "Bingo Geda voice enabled"
    );

    setStatus(
      "🔊 Voice enabled"
    );

  } else {

    button.textContent =
      "🔇 VOICE OFF";

    button.classList.add(
      "off"
    );

    if (
      "speechSynthesis"
      in window
    ) {

      window.speechSynthesis.cancel();

    }

    setStatus(
      "🔇 Voice disabled"
    );

  }

}


/* =====================================================
   SPEAK
===================================================== */

function speakText(text) {

  if (!voiceEnabled) {
    return;
  }

  if (
    !("speechSynthesis" in window)
  ) {

    return;

  }

  try {

    window.speechSynthesis.cancel();

    const speech =
      new SpeechSynthesisUtterance(
        text
      );

    speech.rate = 0.82;

    speech.pitch = 1;

    speech.volume = 1;

    window.speechSynthesis.speak(
      speech
    );

  } catch (error) {

    console.error(
      "Voice error:",
      error
    );

  }

}


/* =====================================================
   ANNOUNCE NUMBER
===================================================== */

function announceNumber(
  number,
  letter
) {

  const display =
    letter +
    " " +
    number;

  document.getElementById(
    "lastNumber"
  ).textContent = display;

  speakText(
    letter +
    " " +
    number
  );

}


/* =====================================================
   TELEGRAM USER
===================================================== */

async function loadUser() {

  try {

    const response =
      await fetch(
        API +
        "/api/me",
        {
          headers:
            headers()
        }
      );

    const data =
      await response.json();

    if (!response.ok) {

      document.getElementById(
        "userBox"
      ).textContent =
        "⚠️ Telegram authentication failed";

      return;

    }

    const user =
      data.user;

    isOwner =
      data.isOwner === true;

    document.getElementById(
      "userBox"
    ).textContent =
      "👤 " +
      (
        user.first_name ||
        "Player"
      ) +
      (
        isOwner
          ? "  👑 OWNER"
          : ""
      );

    if (isOwner) {

      document.getElementById(
        "ownerPanel"
      ).style.display =
        "block";

    }

  } catch (error) {

    console.error(error);

    document.getElementById(
      "userBox"
    ).textContent =
      "⚠️ Connection error";

  }

}


/* =====================================================
   LOAD GAME
===================================================== */

async function loadGame() {

  try {

    const response =
      await fetch(
        API +
        "/api/game"
      );

    const data =
      await response.json();


    /* No active game */

    if (!data.game) {

      currentGame = null;

      myPlayer = null;

      myCard = null;

      document.getElementById(
        "entry"
      ).textContent =
        "-- ETB";

      document.getElementById(
        "players"
      ).textContent =
        "0/50";

      document.getElementById(
        "prize"
      ).textContent =
        "-- ETB";

      document.getElementById(
        "lastNumber"
      ).textContent =
        "—";

      document.getElementById(
        "winnerBox"
      ).style.display =
        "none";

      renderCard(null);

      renderCalledNumbers([]);

      setStatus(
        "Waiting for a new game..."
      );

      return;

    }


    currentGame =
      data.game;


    /* Game information */

    document.getElementById(
      "entry"
    ).textContent =
      Number(
        data.game.entry_fee
      ) +
      " ETB";


    document.getElementById(
      "players"
    ).textContent =
      data.game.players +
      "/" +
      data.game.max_players;


    document.getElementById(
      "prize"
    ).textContent =
      Number(
        data.game.prize_amount
      ) +
      " ETB";


    /* Called numbers */

    const called =
      data.game.called_numbers ||
      [];

    renderCalledNumbers(
      called
    );


    /* Last number */

    if (
      data.game.current_number
    ) {

      document.getElementById(
        "lastNumber"
      ).textContent =
        getLetter(
          data.game.current_number
        ) +
        " " +
        data.game.current_number;

    } else {

      document.getElementById(
        "lastNumber"
      ).textContent =
        "—";

    }


    /* Winner */

    if (
      data.game.winner_user_id
    ) {

      showWinner(
        data.game.winner_user_id
      );

    } else {

      document.getElementById(
        "winnerBox"
      ).style.display =
        "none";

    }


    /* Update card */

    renderCard(
      myCard
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "Unable to load game"
    );

  }

}


/* =====================================================
   BINGO CARD
===================================================== */

function renderCard(card) {

  const container =
    document.getElementById(
      "bingoCard"
    );

  container.innerHTML = "";


  /* Header */

  [
    "B",
    "I",
    "N",
    "G",
    "O"
  ].forEach(
    letter => {

      const cell =
        document.createElement(
          "div"
        );

      cell.className =
        "cell head";

      cell.textContent =
        letter;

      container.appendChild(
        cell
      );

    }
  );


  if (!card) {

    return;

  }


  const called =
    currentGame?.called_numbers ||
    [];


  /* Card */

  for (
    let row = 0;
    row < 5;
    row++
  ) {

    for (
      let col = 0;
      col < 5;
      col++
    ) {

      const cell =
        document.createElement(
          "div"
        );

      cell.className =
        "cell";


      const value =
        card[row][col];


      /* FREE */

      if (
        row === 2 &&
        col === 2
      ) {

        cell.textContent =
          "FREE";

        cell.classList.add(
          "free"
        );

        cell.classList.add(
          "marked"
        );

      } else {

        cell.textContent =
          value;


        /* Mark called number */

        if (
          called.includes(
            Number(value)
          )
        ) {

          cell.classList.add(
            "marked"
          );

        }

      }


      container.appendChild(
        cell
      );

    }

  }

}


/* =====================================================
   CALLED NUMBERS
===================================================== */

function renderCalledNumbers(
  called
) {

  const container =
    document.getElementById(
      "numbers"
    );

  container.innerHTML = "";


  for (
    let i = 1;
    i <= 75;
    i++
  ) {

    const number =
      document.createElement(
        "div"
      );

    number.className =
      "num";

    number.textContent =
      i;


    if (
      called.includes(i)
    ) {

      number.classList.add(
        "called"
      );

    }


    container.appendChild(
      number
    );

  }


  /* Refresh card markings */

  if (myCard) {

    renderCard(
      myCard
    );

  }

}


/* =====================================================
   BINGO LETTER
===================================================== */

function getLetter(
  number
) {

  if (
    number >= 1 &&
    number <= 15
  ) {

    return "B";

  }

  if (
    number >= 16 &&
    number <= 30
  ) {

    return "I";

  }

  if (
    number >= 31 &&
    number <= 45
  ) {

    return "N";

  }

  if (
    number >= 46 &&
    number <= 60
  ) {

    return "G";

  }

  if (
    number >= 61 &&
    number <= 75
  ) {

    return "O";

  }

  return "";

}


/* =====================================================
   PAYMENT
===================================================== */

async function payAndJoin() {

  if (!currentGame) {

    setStatus(
      "❌ No active game"
    );

    return;

  }


  if (
    currentGame.status !==
    "waiting"
  ) {

    setStatus(
      "❌ Game is no longer accepting players"
    );

    return;

  }


  if (
    Number(
      currentGame.players
    ) >=
    Number(
      currentGame.max_players
    )
  ) {

    setStatus(
      "❌ Game is full"
    );

    return;

  }


  setStatus(
    "💳 Creating Telebirr payment..."
  );


  try {

    const response =
      await fetch(
        API +
        "/api/payment/create",
        {
          method:
            "POST",

          headers:
            headers(),

          body:
            JSON.stringify({
              game_id:
                currentGame.id
            })

        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      setStatus(
        "❌ " +
        (
          data.error ||
          "Payment creation failed"
        )
      );

      return;

    }


    /*
      IMPORTANT:

      Real Telebirr checkout is not
      connected yet.

      This endpoint currently creates
      a pending payment record only.
    */

    setStatus(
      "💳 Payment request created. Telebirr integration is pending."
    );


    console.log(
      "Payment:",
      data
    );

  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Payment error"
    );

  }

}


/* =====================================================
   OWNER - NEW GAME
===================================================== */

async function newGame() {

  if (!isOwner) {

    alert(
      "Owner only"
    );

    return;

  }


  try {

    const response =
      await fetch(
        API +
        "/api/game-types"
      );


    const data =
      await response.json();


    if (
      !data.games?.length
    ) {

      alert(
        "No game configuration available"
      );

      return;

    }


    const gameType =
      data.games[0];


    const createResponse =
      await fetch(
        API +
        "/api/owner/new-game",
        {
          method:
            "POST",

          headers:
            headers(),

          body:
            JSON.stringify({
              game_type_id:
                gameType.id
            })
        }
      );


    const result =
      await createResponse.json();


    if (!createResponse.ok) {

      alert(
        result.error ||
        "Could not create game"
      );

      return;

    }


    currentGame =
      result.game;

    myCard = null;

    myPlayer = null;


    document.getElementById(
      "winnerBox"
    ).style.display =
      "none";


    document.getElementById(
      "lastNumber"
    ).textContent =
      "—";


    renderCalledNumbers([]);


    setStatus(
      "🆕 New game created — 0/50 players"
    );


    await loadGame();

  } catch (error) {

    console.error(error);

    alert(
      "Connection error"
    );

  }

}


/* =====================================================
   OWNER - CALL NUMBER
===================================================== */

async function callNumber() {

  if (!isOwner) {

    alert(
      "Owner only"
    );

    return;

  }


  try {

    const response =
      await fetch(
        API +
        "/api/owner/call-number",
        {
          method:
            "POST",

          headers:
            headers()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Could not call number"
      );

      return;

    }


    announceNumber(
      data.number,
      data.letter
    );


    renderCalledNumbers(
      data.called_numbers ||
      []
    );


    if (currentGame) {

      currentGame.called_numbers =
        data.called_numbers;

      currentGame.current_number =
        data.number;

      currentGame.status =
        "playing";

    }


    setStatus(
      "🎱 " +
      data.letter +
      " " +
      data.number
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Could not call number"
    );

  }

}


/* =====================================================
   AUTO CALL
===================================================== */

async function toggleAuto() {

  if (!isOwner) {

    alert(
      "Owner only"
    );

    return;

  }


  const newState =
    !autoCall;


  try {

    const response =
      await fetch(
        API +
        "/api/owner/auto-call",
        {
          method:
            "POST",

          headers:
            headers(),

          body:
            JSON.stringify({
              enabled:
                newState
            })
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Could not change Auto Call"
      );

      return;

    }


    autoCall =
      data.auto_call;


    setStatus(
      autoCall
        ? "🤖 Auto Call ON — numbers will be called every 5 seconds"
        : "⏹️ Auto Call OFF"
    );


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Auto Call error"
    );

  }

}


/* =====================================================
   RESET GAME
===================================================== */

async function resetGame() {

  if (!isOwner) {

    alert(
      "Owner only"
    );

    return;

  }


  if (
    !confirm(
      "Reset the current game?"
    )
  ) {

    return;

  }


  try {

    const response =
      await fetch(
        API +
        "/api/owner/reset-game",
        {
          method:
            "POST",

          headers:
            headers()
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.error ||
        "Reset failed"
      );

      return;

    }


    /* Completely clear old game */

    currentGame = null;

    myPlayer = null;

    myCard = null;

    autoCall = false;


    document.getElementById(
      "lastNumber"
    ).textContent =
      "—";


    document.getElementById(
      "entry"
    ).textContent =
      "-- ETB";


    document.getElementById(
      "players"
    ).textContent =
      "0/50";


    document.getElementById(
      "prize"
    ).textContent =
      "-- ETB";


    document.getElementById(
      "winnerBox"
    ).style.display =
      "none";


    renderCard(null);

    renderCalledNumbers([]);


    setStatus(
      "🔄 Game reset — waiting for new game..."
    );


    await loadGame();


  } catch (error) {

    console.error(error);

    setStatus(
      "❌ Reset error"
    );

  }

}


/* =====================================================
   WINNER
===================================================== */

function showWinner(
  userId
) {

  const box =
    document.getElementById(
      "winnerBox"
    );

  box.style.display =
    "block";


  box.textContent =
    "🏆 BINGO WINNER! Player " +
    userId;

}


/* =====================================================
   WEBSOCKET
===================================================== */

function connectWebSocket() {

  const protocol =
    location.protocol ===
    "https:"
      ? "wss:"
      : "ws:";


  socket =
    new WebSocket(
      protocol +
      "//" +
      location.host
    );


  socket.onopen =
    function () {

      console.log(
        "WebSocket connected"
      );

    };


  socket.onmessage =
    function(event) {

      try {

        const data =
          JSON.parse(
            event.data
          );


        console.log(
          "WS:",
          data
        );


        /* ================= NUMBER ================= */

        if (
          data.type ===
          "number_called"
        ) {

          if (!currentGame) {
            return;
          }


          currentGame.called_numbers =
            data.called_numbers ||
            [];

          currentGame.current_number =
            data.number;

          currentGame.status =
            "playing";


          document.getElementById(
            "lastNumber"
          ).textContent =
            data.letter +
            " " +
            data.number;


          renderCalledNumbers(
            data.called_numbers ||
            []
          );


          announceNumber(
            data.number,
            data.letter
          );


          setStatus(
            "🎱 " +
            data.letter +
            " " +
            data.number
          );

        }


        /* ================= PLAYER JOIN ================= */

        if (
          data.type ===
          "player_joined"
        ) {

          loadGame();

        }


        /* ================= NEW GAME ================= */

        if (
          data.type ===
          "game_created"
        ) {

          currentGame =
            data.game;

          myCard = null;

          myPlayer = null;


          document.getElementById(
            "winnerBox"
          ).style.display =
            "none";


          document.getElementById(
            "lastNumber"
          ).textContent =
            "—";


          loadGame();

        }


        /* ================= RESET ================= */

        if (
          data.type ===
          "game_reset"
        ) {

          currentGame = null;

          myPlayer = null;

          myCard = null;

          autoCall = false;


          document.getElementById(
            "lastNumber"
          ).textContent =
            "—";


          document.getElementById(
            "winnerBox"
          ).style.display =
            "none";


          renderCard(null);

          renderCalledNumbers([]);


          loadGame();

        }


        /* ================= WINNER ================= */

        if (
          data.type ===
          "winner"
        ) {

          showWinner(
            data.user_id
          );


          autoCall =
            false;


          setStatus(
            "🏆 Bingo! Auto Call stopped."
          );


          /* Winner voice */

          speakText(
            "Bingo! We have a winner!"
          );

        }


        /* ================= AUTO CALL ================= */

        if (
          data.type ===
          "auto_call_status"
        ) {

          autoCall =
            data.enabled;

        }


      } catch (error) {

        console.error(
          "WebSocket message error:",
          error
        );

      }

    };


  socket.onclose =
    function() {

      console.log(
        "WebSocket disconnected"
      );


      setTimeout(
        connectWebSocket,
        3000
      );

    };

}


/* =====================================================
   START
===================================================== */

async function start() {

  /* First load */

  renderCalledNumbers([]);

  await loadUser();

  await loadGame();

  connectWebSocket();


  setStatus(
    "✅ Bingo Geda ready"
  );

}


/* =====================================================
   START APP
===================================================== */

start();

</script>
