<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0"
  />

  <title>Bingo Geda</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f3f5f9;
      color: #18202a;
      min-height: 100vh;
    }

    .app {
      max-width: 520px;
      margin: auto;
      padding: 16px;
    }

    /* Header */
    .header {
      background: linear-gradient(135deg, #111827, #273449);
      color: white;
      padding: 22px;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    .brand {
      font-size: 28px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 5px;
      opacity: 0.75;
      font-size: 14px;
    }

    /* Game info */
    .game-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 15px;
    }

    .info-box {
      background: white;
      border-radius: 15px;
      padding: 14px 8px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .info-title {
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 5px;
    }

    .info-value {
      font-size: 18px;
      font-weight: 800;
    }

    /* Called number */
    .called-box {
      background: white;
      border-radius: 20px;
      padding: 20px;
      text-align: center;
      margin-bottom: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    .called-label {
      color: #6b7280;
      font-size: 13px;
      margin-bottom: 8px;
    }

    .called-number {
      width: 80px;
      height: 80px;
      margin: auto;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      font-size: 32px;
      font-weight: 900;
    }

    /* Bingo card */
    .card-section {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .bingo-card {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }

    .cell {
      aspect-ratio: 1;
      border-radius: 10px;
      background: #eef1f5;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transition: 0.15s;
    }

    .cell.header-cell {
      background: #111827;
      color: white;
      font-size: 15px;
    }

    .cell.marked {
      background: #16a34a;
      color: white;
      transform: scale(0.95);
    }

    .free {
      background: #f59e0b !important;
      color: white;
    }

    /* Numbers */
    .numbers-section {
      background: white;
      border-radius: 20px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .numbers {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .number {
      width: 39px;
      height: 39px;
      border-radius: 50%;
      background: #eef1f5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
    }

    .number.called {
      background: #111827;
      color: white;
    }

    /* Button */
    .join-btn {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-size: 18px;
      font-weight: 800;
      color: white;
      background: #16a34a;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(22,163,74,0.25);
    }

    .join-btn:active {
      transform: scale(0.98);
    }

    .status {
      text-align: center;
      margin-top: 12px;
      font-size: 13px;
      color: #6b7280;
    }

    /* User */
    .user-box {
      margin-top: 15px;
      text-align: center;
      color: #6b7280;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="app">

    <!-- Header -->
    <div class="header">
      <div class="brand">🎱 Bingo Geda</div>
      <div class="subtitle">
        Multiplayer Bingo Mini App
      </div>
    </div>

    <!-- Game Information -->
    <div class="game-info">

      <div class="info-box">
        <div class="info-title">ENTRY</div>
        <div class="info-value">50 ETB</div>
      </div>

      <div class="info-box">
        <div class="info-title">PLAYERS</div>
        <div class="info-value" id="players">8/10</div>
      </div>

      <div class="info-box">
        <div class="info-title">PRIZE</div>
        <div class="info-value">400 ETB</div>
      </div>

    </div>

    <!-- Called Number -->
    <div class="called-box">

      <div class="called-label">
        LAST CALLED NUMBER
      </div>

      <div class="called-number" id="lastNumber">
        42
      </div>

    </div>

    <!-- Bingo Card -->
    <div class="card-section">

      <div class="section-title">
        🎟️ Your Bingo Card
      </div>

      <div class="bingo-card" id="bingoCard">

        <div class="cell header-cell">B</div>
        <div class="cell header-cell">I</div>
        <div class="cell header-cell">N</div>
        <div class="cell header-cell">G</div>
        <div class="cell header-cell">O</div>

      </div>

    </div>

    <!-- Called Numbers -->
    <div class="numbers-section">

      <div class="section-title">
        🔢 Called Numbers
      </div>

      <div class="numbers" id="numbers"></div>

    </div>

    <!-- Join -->
    <button class="join-btn" onclick="joinGame()">
      🎟️ PAY & JOIN
    </button>

    <div class="status" id="status">
      Waiting for players...
    </div>

    <div class="user-box" id="userBox">
      Telegram user
    </div>

  </div>


  <script>

    /*
      Telegram Mini App
    */

    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();
    }


    /*
      Generate Bingo Card
    */

    function randomNumbers(min, max, count) {

      const numbers = [];

      while (numbers.length < count) {

        const number =
          Math.floor(Math.random() * (max - min + 1)) + min;

        if (!numbers.includes(number)) {
          numbers.push(number);
        }
      }

      return numbers;
    }


    function createCard() {

      const card = document.getElementById("bingoCard");

      const columns = [
        randomNumbers(1, 15, 5),
        randomNumbers(16, 30, 5),
        randomNumbers(31, 45, 5),
        randomNumbers(46, 60, 5),
        randomNumbers(61, 75, 5)
      ];

      for (let row = 0; row < 5; row++) {

        for (let col = 0; col < 5; col++) {

          const cell = document.createElement("div");

          cell.className = "cell";

          if (row === 2 && col === 2) {

            cell.textContent = "FREE";
            cell.classList.add("free");
            cell.classList.add("marked");

          } else {

            cell.textContent = columns[col][row];

            cell.onclick = function () {
              cell.classList.toggle("marked");
            };

          }

          card.appendChild(cell);
        }
      }
    }


    /*
      Called numbers
    */

    function createNumbers() {

      const container =
        document.getElementById("numbers");

      for (let i = 1; i <= 75; i++) {

        const number = document.createElement("div");

        number.className = "number";
        number.textContent = i;

        if (i === 42 || i === 17 || i === 65) {
          number.classList.add("called");
        }

        container.appendChild(number);
      }
    }


    /*
      Join game
    */

    function joinGame() {

      const status =
        document.getElementById("status");

      status.textContent =
        "Joining game...";

      setTimeout(() => {

        status.textContent =
          "✅ Game joined successfully!";

      }, 1000);

    }


    /*
      Telegram user
    */

    function loadTelegramUser() {

      const userBox =
        document.getElementById("userBox");

      if (
        tg &&
        tg.initDataUnsafe &&
        tg.initDataUnsafe.user
      ) {

        const user =
          tg.initDataUnsafe.user;

        userBox.textContent =
          "👤 " +
          (user.first_name || "Player");

      } else {

        userBox.textContent =
          "👤 Demo Player";

      }
    }


    /*
      Start
    */

    createCard();
    createNumbers();
    loadTelegramUser();

  </script>

</body>
</html>
